<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eniversal UI/UX Draft</title>

<style>
:root{--ink:#0E1116;--panel:#171B22;--raise:#222833;--line:#2C323D;--line2:#454D5B;--text:#F4F2EC;--mute:#AEB4BF;--sun:#F5B82E;--sky:#8FB8FF;--on:#16120A}
*{box-sizing:border-box}
.s{width:390px;height:844px;background:var(--ink);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.4;position:relative;overflow:hidden;display:flex;flex-direction:column}
.page{background:var(--ink);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;width:100%;min-height:100%}
.wrapx{max-width:1360px;margin:0 auto;padding:64px 40px;display:flex;flex-direction:column;gap:56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;min-height:64px;flex:none}
.body{flex:1;min-height:0;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.foot{flex:none;padding:12px 16px 24px;display:flex;flex-direction:column;gap:8px;background:var(--ink);border-top:1px solid var(--line)}
.d{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0}
.d56{font-size:56px}.d40{font-size:40px}.d32{font-size:32px}.d24{font-size:24px}.d20{font-size:20px;line-height:1.2}.d17{font-size:17px;line-height:1.25}
.b15{font-size:15px}.b13{font-size:13px}.b12{font-size:12px}.b11{font-size:11px}
.w6{font-weight:600}.m{color:var(--mute)}.sun{color:var(--sun)}.sky{color:var(--sky)}.p0{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;letter-spacing:-.01em}
.sec{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.btw{justify-content:space-between}.wrap{flex-wrap:wrap}.g1{flex:1;min-width:0}.start{align-items:flex-start}.ctr{justify-content:center;text-align:center}.none{flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.hot{border-color:var(--sun)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--text);font:500 13px 'Instrument Sans',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip.on{background:var(--sun);color:var(--on);border-color:var(--sun);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;background:var(--raise);color:var(--text);font:500 11px 'JetBrains Mono',monospace;white-space:nowrap}
.tag.y{background:rgba(245,184,46,.16);color:var(--sun)}.tag.b{background:rgba(143,184,255,.16);color:var(--sky)}
.btn{min-height:48px;border-radius:12px;font:600 15px 'Instrument Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:transparent;color:var(--text);text-decoration:none;padding:0 16px;cursor:pointer;text-align:center}
.btn.pri{background:var(--sun);color:var(--on);border-color:var(--sun)}
.btn.sm{min-height:44px;font-size:13px;padding:0 12px}
.ib{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--text);border-radius:12px;cursor:pointer;text-decoration:none;position:relative}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.av{width:44px;height:44px;font-size:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:var(--on);flex:none}
.av.a28{width:28px;height:28px;font-size:11px}.av.a36{width:36px;height:36px;font-size:13px}.av.a64{width:64px;height:64px;font-size:22px}.av.a96{width:96px;height:96px;font-size:34px}
.c1{background:#F5B82E}.c2{background:#8FB8FF}.c3{background:#F2A58E}.c4{background:#9FD8C4}.c5{background:#C9B6F2}
.open{outline:3px solid var(--sun);outline-offset:2px}
.stack{display:flex}.stack .av{margin-left:-8px;border:2px solid var(--panel)}.stack .av:first-child{margin-left:0}
.ln{height:1px;background:var(--line);flex:none;width:100%}
.bar{height:6px;border-radius:6px;background:var(--raise);overflow:hidden;flex:none}.bar i{display:block;height:100%;background:var(--sun);border-radius:6px}.bar i.b{background:var(--sky)}
.seg{display:flex;gap:6px;flex:none;padding:0 16px 10px;overflow:hidden}
.input{min-height:48px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:12px;color:var(--text);padding:0 14px;font:400 15px 'Instrument Sans',sans-serif}
.tabbar{width:390px;height:76px;display:flex;padding:8px 6px 14px;border-top:1px solid var(--line);background:#12151B;font-family:'Instrument Sans',sans-serif;flex:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:11px;font-weight:500;text-decoration:none;min-height:44px}
.tab.on{color:var(--sun);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none}
.tr{display:flex;gap:10px}.tr .rail{width:12px;flex:none;border-left:2px solid var(--line2);margin-left:5px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2)}.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}

html{scroll-behavior:smooth;background:#090B0F}
body{margin:0;background:#090B0F;color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif}
.nav{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 24px;background:#090B0F;border-bottom:1px solid var(--line)}
.nav .brand{margin-right:auto}
.view{display:none}.view.on{display:block}
.flow{padding:48px 24px 8px;max-width:2000px;margin:0 auto}
.phones{display:flex;flex-wrap:wrap;gap:48px 40px;margin-top:24px}
.ph{margin:0;width:390px;max-width:100%}
.ph figcaption{font:500 12px 'JetBrains Mono',monospace;color:var(--mute);margin-bottom:10px}
.mount>.s{border-radius:24px;border:1px solid var(--line);transition:box-shadow .2s}
.flash>.s{box-shadow:0 0 0 3px var(--sun)}
.mount .tabbar{width:100%}
@media (max-width:440px){.flow{padding:32px 0 8px}.flow h2{padding:0 16px}.ph figcaption{padding:0 16px}.nav{padding:10px 16px}.mount>.s{border-radius:0;border-width:1px 0;width:100%!important}}
</style>
</head>

tion><div class="mount" id="m-MatchDetail" data-c="MatchDetail"></div></figure><figure class="ph"><figcaption>4.3 Interested in you</figcaption><div class="mount" id="m-Interested" data-c="Interested"></div></figure><figure class="ph"><figcaption>4.4 Match chat</figcaption><div class="mount" id="m-Chat" data-c="Chat"></div></figure></div></section><section class="flow"><h2 class="d d32">5. Launch and pooled waitlist</h2><div class="phones"><figure class="ph"><figcaption>5.1 Launches</figcaption><div class="mount" id="m-Build" data-c="Build"></div></figure><figure class="ph"><figcaption>5.2 Launch page</figcaption><div class="mount" id="m-LaunchPage" data-c="LaunchPage"></div></figure><figure class="ph"><figcaption>5.3 Pooled waitlist</figcaption><div class="mount" id="m-JoinPool" data-c="JoinPool"></div></figure><figure class="ph"><figcaption>5.4 Builder console</figcaption><div class="mount" id="m-Console" data-c="Console"></div></figure></div></section><section class="flow"><h2 class="d d32">6. Events and gap finding</h2><div class="phones"><figure class="ph"><figcaption>6.1 Events</figcaption><div class="mount" id="m-Events" data-c="Events"></div></figure><figure class="ph"><figcaption>6.2 Event</figcaption><div class="mount" id="m-EventDetail" data-c="EventDetail"></div></figure><figure class="ph"><figcaption>6.3 Topic radar</figcaption><div class="mount" id="m-Radar" data-c="Radar"></div></figure></div></section><section class="flow"><h2 class="d d32">7. Every audience, every day</h2><div class="phones"><figure class="ph"><figcaption>7.1 Investor home</figcaption><div class="mount" id="m-Investor" data-c="Investor"></div></figure><figure class="ph"><figcaption>7.2 Roles for interns and pros</figcaption><div class="mount" id="m-Roles" data-c="Roles"></div></figure><figure class="ph"><figcaption>7.3 Create</figcaption><div class="mount" id="m-Create" data-c="Create"></div></figure><figure class="ph"><figcaption>7.4 Activity</figcaption><div class="mount" id="m-In const get=(sc,path)=>{path=path.trim();if(path==='true')return true;if(path==='false')return false;return path.split('.').reduce((o,k)=>o==null?undefined:o[k],sc)};
const WHOLE=/^\s*\{\{([^}]+)\}\}\s*$/;
const interp=(s,sc)=>s.replace(/\{\{([^}]+)\}\}/g,(_,p)=>{const v=get(sc,p);return v==null?'':String(v)});
function kids(node,sc,into){node.childNodes.forEach(c=>walk(c,sc,into))}
function loop(el,sc,into,build){
  const list=get(sc,WHOLE.exec(el.getAttribute(el.hasAttribute('data-sc-for')?'list':'list'))[1])||[];
  const as=el.getAttribute('as');
  list.forEach((item,i)=>build(Object.assign({},sc,{[as]:item,$index:i})));
}
function walk(n,sc,into){
  if(n.nodeType===3){into.appendChild(document.createTextNode(interp(n.nodeValue,sc)));return}
  if(n.nodeType!==1)return;
  const tag=n.localName;
  if(tag==='sc-for'){loop(n,sc,into,s=>kids(n,s,into));return}
  if(tag==='sc-if'){if(get(sc,WHOLE.exec(n.getAttribute('value'))[1]))kids(n,sc,into);return}
  if(tag==='dc-import'){
    const props={};for(const a of n.attributes)if(!a.name.startsWith('hint-')&&a.name!=='name')props[a.name]=interp(a.value,sc);
    mount(n.getAttribute('name'),props,into);return}
  if(n.hasAttribute&&n.hasAttribute('data-sc-for')){
    const c=n.cloneNode(true);c.removeAttribute('data-sc-for');
    loop(n,sc,into,s=>{const d=c.cloneNode(true);['list','as'].forEach(a=>d.removeAttribute(a));for(const a of [...d.attributes])if(a.name.startsWith('hint-'))d.removeAttribute(a.name);walk(d,s,into)});return}
  const e=n.cloneNode(false);
  for(const a of [...e.attributes]){
    if(!a.value.includes('{{'))continue;
    const m=WHOLE.exec(a.value);
    if(a.name==='onclick'){e.removeAttribute('onclick');const f=m&&get(sc,m[1]);if(typeof f==='function')e.addEventListener('click',ev=>{ev.preventDefault();f(ev)});continue}
    e.setAttribute(a.name,interp(a.value,sc));
  }
  kids(n,sc,e);into.appendChild(e);
}
function mount(name,props,into){
  const Cmp=COMPONENTS[name],inst=new Cmp(props),host=document.createElement('div');
  host.style.display='contents';into.appendChild(host);
  const tpl=document.getElementById('t-'+name).content;
  inst._r=()=>{const f=document.createDocumentFragment();kids(tpl,inst.renderVals(),f);host.replaceChildren(f)};
  inst._r();
}
document.querySelectorAll('.mount').forEach(m=>mount(m.dataset.c,{},m));
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));document.querySelectorAll('.nav .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){show(b.dataset.v);window.scrollTo(0,0)}});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');if(!a)return;
  const m=/^([A-Za-z]+)\.dc\.html$/.exec(a.getAttribute('href'));if(!m)return;
  e.preventDefault();const t=document.getElementById('m-'+m[1]);if(!t)return;
  show('screens');t.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
